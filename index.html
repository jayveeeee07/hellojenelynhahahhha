<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Love | Home</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background-color: #000;
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
        }
        
        .welcome-container {
            text-align: center;
            z-index: 100;
            position: relative;
            padding: 30px;
            background-color: rgba(0, 0, 0, 0.7);
            border-radius: 20px;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            max-width: 600px;
            margin: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }
        
        h1 {
            font-size: 3.5rem;
            margin-bottom: 15px;
            background: linear-gradient(45deg, #ff3366, #ffcc00, #33ccff, #ff3366);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: gradient 4s ease infinite;
        }
        
        .tagline {
            font-size: 1.2rem;
            color: #aaa;
            margin-bottom: 30px;
            font-weight: 300;
            letter-spacing: 1px;
        }
        
        @keyframes gradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        
        .start-button {
            display: inline-block;
            background: linear-gradient(45deg, #ff3366, #ffcc00);
            color: white;
            border: none;
            padding: 18px 45px;
            font-size: 1.3rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            margin-top: 20px;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(255, 51, 102, 0.4);
            position: relative;
            overflow: hidden;
        }
        
        .start-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(255, 51, 102, 0.6);
            letter-spacing: 1px;
        }
        
        .start-button:active {
            transform: translateY(1px);
        }
        
        .start-button i {
            margin-left: 10px;
            transition: transform 0.3s ease;
        }
        
        .start-button:hover i {
            transform: translateX(5px);
        }
        
        .instructions {
            margin-top: 30px;
            color: #888;
            font-size: 0.9rem;
            max-width: 500px;
            line-height: 1.5;
        }
        
        .fireworks-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }
        
        .firework {
            position: absolute;
            width: 5px;
            height: 5px;
            border-radius: 50%;
            box-shadow: 0 0 10px 2px;
        }
        
        .heart {
            position: absolute;
            color: #ff3366;
            font-size: 20px;
            opacity: 0;
            z-index: 2;
            animation: float 8s linear infinite;
        }
        
        @keyframes float {
            0% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(-100px) rotate(360deg);
                opacity: 0;
            }
        }
        
        .footer {
            position: fixed;
            bottom: 20px;
            width: 100%;
            text-align: center;
            color: #666;
            font-size: 0.9rem;
            z-index: 10;
        }
        
        /* Responsive design */
        @media (max-width: 768px) {
            h1 {
                font-size: 2.8rem;
            }
            
            .start-button {
                padding: 16px 40px;
                font-size: 1.2rem;
            }
            
            .welcome-container {
                margin: 15px;
                padding: 25px;
            }
        }
        
        @media (max-width: 480px) {
            h1 {
                font-size: 2.2rem;
            }
            
            .tagline {
                font-size: 1rem;
            }
            
            .start-button {
                padding: 14px 35px;
                font-size: 1.1rem;
            }
        }
    </style>
</head>
<body>
    <div class="fireworks-container" id="fireworks"></div>
    
    <div class="welcome-container">
        <h1>For My Love</h1>
        <p class="tagline">A special message is waiting for you</p>
        
        <a href="home.html" class="start-button" id="startButton">
            Get Started <i class="fas fa-arrow-right"></i>
        </a>
        
        <p class="instructions">
            Click the button above to see a special message. You'll experience a beautiful 10-second loading screen with fireworks before reaching the main page.
        </p>
    </div>
    
    <div class="footer">
        Made with <i class="fas fa-heart" style="color:#ff3366;"></i> for someone special
    </div>

    <script>
        // Create fireworks
        const fireworksContainer = document.getElementById('fireworks');
        const colors = ['#ff3366', '#33ccff', '#ffcc00', '#9933ff', '#33ff99'];
        
        function createFirework(x, y) {
            const firework = document.createElement('div');
            firework.className = 'firework';
            firework.style.left = x + 'px';
            firework.style.top = y + 'px';
            firework.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
            firework.style.boxShadow = `0 0 10px 2px ${firework.style.backgroundColor}`;
            
            fireworksContainer.appendChild(firework);
            
            // Create explosion particles
            const particleCount = 40 + Math.floor(Math.random() * 25);
            
            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.className = 'firework';
                particle.style.left = x + 'px';
                particle.style.top = y + 'px';
                particle.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                particle.style.boxShadow = `0 0 5px 1px ${particle.style.backgroundColor}`;
                
                fireworksContainer.appendChild(particle);
                
                // Random direction and distance
                const angle = Math.random() * Math.PI * 2;
                const speed = 1.5 + Math.random() * 2.5;
                const distance = 40 + Math.random() * 120;
                
                const dx = Math.cos(angle) * speed;
                const dy = Math.sin(angle) * speed;
                
                let currentDistance = 0;
                
                const particleAnimation = setInterval(() => {
                    currentDistance += speed;
                    
                    particle.style.left = (parseFloat(particle.style.left) + dx) + 'px';
                    particle.style.top = (parseFloat(particle.style.top) + dy) + 'px';
                    particle.style.opacity = 1 - (currentDistance / distance);
                    
                    if (currentDistance >= distance) {
                        clearInterval(particleAnimation);
                        particle.remove();
                    }
                }, 20);
            }
            
            // Remove firework after explosion
            setTimeout(() => {
                firework.remove();
            }, 800);
        }
        
        // Create floating hearts
        function createHeart() {
            const heart = document.createElement('div');
            heart.innerHTML = '<i class="fas fa-heart"></i>';
            heart.className = 'heart';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.color = colors[Math.floor(Math.random() * colors.length)];
            heart.style.fontSize = (15 + Math.random() * 25) + 'px';
            heart.style.animationDuration = (5 + Math.random() * 10) + 's';
            heart.style.animationDelay = Math.random() * 3 + 's';
            
            document.body.appendChild(heart);
            
            // Remove heart after animation completes
            setTimeout(() => {
                heart.remove();
            }, 12000);
        }
        
        // Generate fireworks at random intervals
        setInterval(() => {
            const x = Math.random() * window.innerWidth;
            const y = Math.random() * window.innerHeight;
            createFirework(x, y);
        }, 500);
        
        // Generate hearts at random intervals
        setInterval(() => {
            createHeart();
        }, 800);
        
        // Also create fireworks on click anywhere
        document.addEventListener('click', (e) => {
            // Don't create fireworks if clicking the button (it will redirect)
            if (e.target.id !== 'startButton' && !e.target.closest('#startButton')) {
                createFirework(e.clientX, e.clientY);
            }
        });
        
        // Button click handler - could add additional effects here
        document.getElementById('startButton').addEventListener('click', function(e) {
            // Create a burst of fireworks at the button location
            const rect = this.getBoundingClientRect();
            const x = rect.left + rect.width/2;
            const y = rect.top + rect.height/2;
            
            // Create multiple fireworks at button location
            for(let i = 0; i < 8; i++) {
                setTimeout(() => {
                    createFirework(x + (Math.random() * 100 - 50), y + (Math.random() * 100 - 50));
                }, i * 50);
            }
            
            // Button animation
            this.style.transform = 'scale(0.95)';
            setTimeout(() => {
                this.style.transform = '';
            }, 150);
        });
    </script>
</body>
</html>
