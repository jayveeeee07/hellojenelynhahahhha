<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Special Message | Home</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background-color: #000;
            color: #fff;
            overflow: hidden;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .container {
            text-align: center;
            z-index: 10;
            position: relative;
            padding: 20px;
            max-width: 800px;
            width: 90%;
        }
        
        /* Phase 1: Loading Screen */
        .loading-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        
        .loading-title {
            font-size: 4rem;
            margin-bottom: 20px;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.7);
            background: linear-gradient(45deg, #ff3366, #33ccff, #ffcc00, #ff3366);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: gradient 3s ease infinite, pulse 2s ease-in-out infinite;
        }
        
        @keyframes gradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        
        .loading-subtitle {
            font-size: 1.5rem;
            margin-bottom: 30px;
            color: #ffcc00;
            font-weight: 300;
            letter-spacing: 2px;
        }
        
        .loading-bar-container {
            margin-top: 40px;
            width: 100%;
            max-width: 400px;
        }
        
        .loading-bar {
            width: 100%;
            height: 12px;
            background-color: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            margin: 0 auto 15px;
            overflow: hidden;
            position: relative;
        }
        
        .loading-progress {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #ff3366, #ffcc00);
            border-radius: 10px;
            animation: loading 10s linear forwards;
        }
        
        @keyframes loading {
            0% { width: 0%; }
            100% { width: 100%; }
        }
        
        .timer {
            font-size: 1.3rem;
            color: #33ccff;
            margin-top: 10px;
            font-weight: bold;
        }
        
        /* Phase 2: Warning Message */
        .warning-screen {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            animation: warningAppear 0.5s ease-out;
        }
        
        @keyframes warningAppear {
            0% { opacity: 0; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1); }
        }
        
        .warning-icon {
            font-size: 6rem;
            color: #ff3366;
            margin-bottom: 30px;
            animation: warningPulse 1.5s infinite;
        }
        
        @keyframes warningPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.2); }
        }
        
        .warning-title {
            font-size: 3.5rem;
            color: #ff3366;
            margin-bottom: 20px;
            text-shadow: 0 0 15px rgba(255, 51, 102, 0.7);
        }
        
        .warning-message {
            font-size: 1.8rem;
            color: #ffcc00;
            margin-bottom: 40px;
            text-align: center;
            line-height: 1.4;
            max-width: 600px;
        }
        
        .countdown-large {
            font-size: 5rem;
            color: #fff;
            font-weight: bold;
            margin: 20px 0;
            text-shadow: 0 0 10px #33ccff;
            font-family: monospace;
        }
        
        /* Phase 3: Screen Off Effect */
        .screen-off {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            z-index: 1000;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            animation: turnOff 1.5s ease-out forwards;
        }
        
        @keyframes turnOff {
            0% { opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; background-color: #000; }
            100% { opacity: 1; background-color: #000; }
        }
        
        .power-off-icon {
            font-size: 8rem;
            color: #666;
            margin-bottom: 30px;
            opacity: 0;
            animation: powerOffFade 2s ease-out 0.5s forwards;
        }
        
        @keyframes powerOffFade {
            0% { opacity: 0; transform: scale(0.5); }
            50% { opacity: 1; transform: scale(1); }
            100% { opacity: 0.5; transform: scale(0.8); }
        }
        
        .off-message {
            font-size: 2rem;
            color: #666;
            text-align: center;
            opacity: 0;
            animation: messageFade 2s ease-out 1s forwards;
        }
        
        @keyframes messageFade {
            0% { opacity: 0; }
            100% { opacity: 0.7; }
        }
        
        /* Fireworks */
        .fireworks-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }
        
        .firework {
            position: absolute;
            width: 5px;
            height: 5px;
            border-radius: 50%;
            box-shadow: 0 0 10px 2px;
        }
        
        .heart {
            position: absolute;
            color: #ff3366;
            font-size: 24px;
            opacity: 0;
            animation: floatUp 5s linear infinite;
        }
        
        @keyframes floatUp {
            0% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(-100px) rotate(360deg);
                opacity: 0;
            }
        }
        
        /* Responsive */
        @media (max-width: 768px) {
            .loading-title, .warning-title {
                font-size: 3rem;
            }
            
            .warning-message {
                font-size: 1.5rem;
            }
            
            .countdown-large {
                font-size: 4rem;
            }
            
            .warning-icon {
                font-size: 5rem;
            }
        }
        
        @media (max-width: 480px) {
            .loading-title, .warning-title {
                font-size: 2.5rem;
            }
            
            .loading-subtitle {
                font-size: 1.2rem;
            }
            
            .warning-message {
                font-size: 1.3rem;
            }
            
            .countdown-large {
                font-size: 3rem;
            }
            
            .warning-icon {
                font-size: 4rem;
            }
            
            .power-off-icon {
                font-size: 6rem;
            }
            
            .off-message {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <!-- Phase 1: Loading Screen -->
    <div class="loading-screen" id="loadingScreen">
        <h1 class="loading-title">I MISS YOU LOVE</h1>
        <div class="loading-subtitle">Every moment without you feels incomplete</div>
        
        <div class="loading-bar-container">
            <div class="loading-bar">
                <div class="loading-progress"></div>
            </div>
            <div class="timer">Loading... <span id="countdown">10</span>s</div>
        </div>
        
        <div class="message" style="margin-top: 40px; color: #aaa; max-width: 600px;">
            <p>This special message was created just for you. Please wait while it loads completely.</p>
        </div>
    </div>
    
    <!-- Phase 2: Warning Message -->
    <div class="warning-screen" id="warningScreen">
        <div class="warning-icon">
            <i class="fas fa-exclamation-triangle"></i>
        </div>
        <h1 class="warning-title">WARNING</h1>
        <div class="warning-message">
            YOUR PHONE WILL BE TURNED OFF
        </div>
        <div class="countdown-large" id="shutdownCountdown">5</div>
        <div style="color: #ffcc00; margin-top: 20px; font-size: 1.2rem;">
            Please do not interrupt the process
        </div>
    </div>
    
    <!-- Phase 3: Screen Off Effect -->
    <div class="screen-off" id="screenOff">
        <div class="power-off-icon">
            <i class="fas fa-power-off"></i>
        </div>
        <div class="off-message">
            Phone is turning off...<br>
            <span style="font-size: 1.2rem; display: block; margin-top: 15px;">This is a simulation</span>
        </div>
    </div>
    
    <!-- Fireworks Container -->
    <div class="fireworks-container" id="fireworks"></div>

    <script>
        // Elements
        const loadingScreen = document.getElementById('loadingScreen');
        const warningScreen = document.getElementById('warningScreen');
        const screenOff = document.getElementById('screenOff');
        const countdownElement = document.getElementById('countdown');
        const shutdownCountdownElement = document.getElementById('shutdownCountdown');
        
        // Countdown variables
        let seconds = 10;
        let shutdownSeconds = 5;
        
        // Phase 1: 10-second loading countdown
        const loadingInterval = setInterval(() => {
            seconds--;
            countdownElement.textContent = seconds;
            
            if (seconds <= 0) {
                clearInterval(loadingInterval);
                switchToWarningScreen();
            }
        }, 1000);
        
        // Function to switch to warning screen
        function switchToWarningScreen() {
            loadingScreen.style.display = 'none';
            warningScreen.style.display = 'flex';
            
            // Create a big firework burst
            createFireworkBurst();
            
            // Start shutdown countdown
            const shutdownInterval = setInterval(() => {
                shutdownSeconds--;
                shutdownCountdownElement.textContent = shutdownSeconds;
                
                if (shutdownSeconds <= 0) {
                    clearInterval(shutdownInterval);
                    turnOffScreen();
                }
            }, 1000);
        }
        
        // Function to simulate turning off the screen
        function turnOffScreen() {
            warningScreen.style.display = 'none';
            screenOff.style.display = 'flex';
            
            // Stop all fireworks
            clearInterval(fireworksInterval);
            clearInterval(heartsInterval);
            
            // Make screen completely black after animation
            setTimeout(() => {
                // Turn off screen simulation
                document.body.style.backgroundColor = '#000';
                
                // Optional: Actually try to turn off screen (requires fullscreen and special permissions)
                // This is a simulated effect for demonstration
                
                // Show message that it's a simulation
                setTimeout(() => {
                    const simulationMsg = document.createElement('div');
                    simulationMsg.innerHTML = `
                        <div style="position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); 
                                   text-align: center; color: #333; z-index: 1001;">
                            <div style="font-size: 2rem; margin-bottom: 20px;">
                                <i class="fas fa-mobile-alt"></i>
                            </div>
                            <div style="font-size: 1.5rem;">
                                Screen off simulation complete<br>
                                <small style="font-size: 1rem; margin-top: 10px; display: block;">
                                    (In a real scenario, this would turn off your device screen)
                                </small>
                            </div>
                            <button onclick="location.reload()" style="
                                margin-top: 30px;
                                background: #ff3366;
                                color: white;
                                border: none;
                                padding: 12px 30px;
                                font-size: 1.2rem;
                                border-radius: 50px;
                                cursor: pointer;
                            ">
                                Restart Experience
                            </button>
                        </div>
                    `;
                    document.body.appendChild(simulationMsg);
                }, 3000);
            }, 2000);
        }
        
        // Create fireworks
        const fireworksContainer = document.getElementById('fireworks');
        const colors = ['#ff3366', '#33ccff', '#ffcc00', '#9933ff', '#33ff99'];
        
        function createFirework(x, y) {
            const firework = document.createElement('div');
            firework.className = 'firework';
            firework.style.left = x + 'px';
            firework.style.top = y + 'px';
            firework.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
            firework.style.boxShadow = `0 0 10px 2px ${firework.style.backgroundColor}`;
            
            fireworksContainer.appendChild(firework);
            
            // Create explosion particles
            const particleCount = 60 + Math.floor(Math.random() * 40);
            
            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.className = 'firework';
                particle.style.left = x + 'px';
                particle.style.top = y + 'px';
                particle.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                particle.style.boxShadow = `0 0 5px 1px ${particle.style.backgroundColor}`;
                
                fireworksContainer.appendChild(particle);
                
                // Random direction and distance
                const angle = Math.random() * Math.PI * 2;
                const speed = 2 + Math.random() * 4;
                const distance = 60 + Math.random() * 180;
                
                const dx = Math.cos(angle) * speed;
                const dy = Math.sin(angle) * speed;
                
                let currentDistance = 0;
                
                const particleAnimation = setInterval(() => {
                    currentDistance += speed;
                    
                    particle.style.left = (parseFloat(particle.style.left) + dx) + 'px';
                    particle.style.top = (parseFloat(particle.style.top) + dy) + 'px';
                    particle.style.opacity = 1 - (currentDistance / distance);
                    
                    if (currentDistance >= distance) {
                        clearInterval(particleAnimation);
                        particle.remove();
                    }
                }, 20);
            }
            
            // Remove firework after explosion
            setTimeout(() => {
                firework.remove();
            }, 1000);
        }
        
        // Create a burst of fireworks
        function createFireworkBurst() {
            for (let i = 0; i < 15; i++) {
                setTimeout(() => {
                    const x = Math.random() * window.innerWidth;
                    const y = Math.random() * window.innerHeight;
                    createFirework(x, y);
                }, i * 100);
            }
        }
        
        // Create floating hearts
        function createHeart() {
            const heart = document.createElement('div');
            heart.innerHTML = '<i class="fas fa-heart"></i>';
            heart.className = 'heart';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.color = colors[Math.floor(Math.random() * colors.length)];
            heart.style.fontSize = (15 + Math.random() * 30) + 'px';
            heart.style.animationDuration = (3 + Math.random() * 7) + 's';
            heart.style.animationDelay = Math.random() * 2 + 's';
            
            document.body.appendChild(heart);
            
            // Remove heart after animation completes
            setTimeout(() => {
                heart.remove();
            }, 7000);
        }
        
        // Generate fireworks at random intervals
        const fireworksInterval = setInterval(() => {
            const x = Math.random() * window.innerWidth;
            const y = Math.random() * window.innerHeight;
            createFirework(x, y);
        }, 300);
        
        // Generate hearts at random intervals
        const heartsInterval = setInterval(() => {
            createHeart();
        }, 500);
        
        // Also create fireworks on click
        document.addEventListener('click', (e) => {
            createFirework(e.clientX, e.clientY);
        });
        
        // Fallback: Automatically proceed if something goes wrong
        setTimeout(() => {
            if (seconds > 0) {
                switchToWarningScreen();
                seconds = 0;
            }
        }, 11000);
        
        setTimeout(() => {
            if (shutdownSeconds > 0) {
                turnOffScreen();
                shutdownSeconds = 0;
            }
        }, 16000);
    </script>
</body>
</html>
